<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Болзоонд урья</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#4a2040;--card:rgba(255,255,255,.86);--soft:#fff;--pink:#ff2d78;--g1:#ff9fd0;--g2:#ffe08a;--g3:#9fd4ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(135deg,var(--g1),var(--g2) 45%,var(--g3));background-size:300% 300%;animation:bg 14s ease infinite;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;display:flex;align-items:safe center;justify-content:center;text-align:center;overflow-x:hidden;overflow-y:auto}
@keyframes bg{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.blob{position:fixed;border-radius:50%;filter:blur(40px);opacity:.8;pointer-events:none;animation:drift 9s ease-in-out infinite}
.b1{width:260px;height:260px;background:#ff4fa3;top:-60px;left:-60px}
.b2{width:300px;height:300px;background:#8a6bff;bottom:-90px;right:-80px;animation-delay:-4s}
.b3{width:200px;height:200px;background:#ffc21f;top:40%;left:60%;animation-delay:-2s}
@keyframes drift{50%{transform:translate(30px,-24px) scale(1.12)}}
.card{position:relative;z-index:1;width:min(92vw,440px);margin:16px 0;padding:26px 22px 30px;display:flex;flex-direction:column;align-items:center;gap:16px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:3px solid #fff;border-radius:38px;box-shadow:0 22px 50px rgba(255,92,147,.28)}
.bunny{width:170px;height:186px;animation:bob 2.2s ease-in-out infinite;transition:transform .25s}
.bunny.pop{transform:scale(1.14) rotate(-5deg)}
.bunny svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 8px 10px rgba(255,92,147,.3))}
@keyframes bob{50%{translate:0 -8px}}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:ear 2.4s ease-in-out infinite}
.ear.r{animation-delay:.5s}
@keyframes ear{50%{transform:rotate(7deg)}}
.tear{transform-box:fill-box;animation:tear 1.5s ease-in infinite}
@keyframes tear{0%{transform:translateY(-4px);opacity:0}20%{opacity:1}100%{transform:translateY(30px);opacity:0}}
h1{font-size:clamp(26px,7vw,34px);font-weight:900;margin:0;line-height:1.2;background:linear-gradient(90deg,#ff1f7a,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;font-weight:700;opacity:.85}
.ic{width:1em;height:1em;fill:currentColor;vertical-align:-.12em}
.btns{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:16px;min-height:120px;width:100%}
button,.main{font-family:inherit;font-weight:800;border:0;cursor:pointer;border-radius:999px;transition:all .25s cubic-bezier(.34,1.56,.64,1);color:#fff;-webkit-tap-highlight-color:transparent;max-width:100%;text-decoration:none;display:inline-block}
button:focus-visible,select:focus-visible,input:focus-visible,.main:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.main{position:relative;isolation:isolate;margin-top:6px;background:linear-gradient(180deg,#ff7ab8,#ff2d78);font-size:20px;padding:14px 30px;border:3px solid #fff;box-shadow:0 6px 0 #d81b60,0 10px 20px rgba(255,45,120,.45);text-shadow:0 1px 2px rgba(150,30,80,.35);animation:wiggle 2.4s ease-in-out infinite}
.main:active{transform:translateY(4px);box-shadow:0 2px 0 #d81b60;animation:none}
@keyframes wiggle{0%,100%{transform:rotate(0)}30%{transform:rotate(-1.6deg) scale(1.02)}60%{transform:rotate(1.6deg)}}
#no{transform:scale(var(--s,1));white-space:nowrap;-webkit-text-size-adjust:100%;text-size-adjust:100%;background:linear-gradient(180deg,#b8a2ff,#8b6bff);color:#fff;font-size:16px;padding:10px 22px;border:3px solid #fff;box-shadow:0 4px 0 #6d4fd8}
#no:active{transform:translateY(3px) scale(var(--s,1));box-shadow:0 1px 0 #6d4fd8}
#no.gone{display:none!important}
.field{display:flex;flex-direction:column;gap:6px;width:100%;text-align:left;font-weight:800}
input,select{font-family:inherit;font-size:18px;font-weight:700;padding:12px 16px;border-radius:18px;border:3px solid #fff;background:var(--soft);color:var(--ink);width:100%;color-scheme:light;box-shadow:0 4px 14px rgba(255,92,147,.2)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{color:#4a2040;font-size:15px;padding:9px 16px;border:3px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.08);background:#ffb8dc}
.chip:nth-child(3n+2){background:#cdb8ff}
.chip:nth-child(3n){background:#ffe08a}
.chip.on{background:linear-gradient(180deg,#ff7ab8,#ff2d78);color:#fff;transform:scale(1.07)}
.msg{background:var(--soft);border-radius:20px;padding:14px 16px;font-weight:800;width:100%;box-shadow:0 4px 14px rgba(255,92,147,.2)}
.small{font-size:14px}
.link{background:none;color:var(--ink);text-decoration:underline;padding:4px;font-size:14px;opacity:.8}
.float{position:fixed;top:-40px;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(420deg)}}
.fb{display:flex;flex-direction:column;align-items:center;gap:12px}
.hidden{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.float{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="h" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.8 8.3 3 4.5 6.7 4.5c2 0 3.7 1.1 5.3 3 1.6-1.9 3.3-3 5.3-3 3.7 0 5.9 3.8 4.3 7.3C19.5 16.4 12 21 12 21z"/></symbol>
<symbol id="s" viewBox="0 0 24 24"><path d="M12 1l2.6 8.4L23 12l-8.4 2.6L12 23l-2.6-8.4L1 12l8.4-2.6z"/></symbol>
</defs></svg>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>

<main class="card" id="ask">
  <div class="bunny" id="bn1"></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <p class="small" id="hint">Зөвшөөрвөл "Тиймээ" товчийг дарна уу</p>
  <div class="btns">
    <button id="yes" class="main"></button>
    <button id="no">Үгүй</button>
  </div>
</main>

<main class="card hidden" id="pick">
  <div class="bunny" id="bn2"></div>
  <h1>Ураа! Баярлалаа</h1>
  <p>Одоо өдөр, цагаа сонгоорой</p>
  <label class="field">Огноо (Бямба, Ням гараг) <select id="date"></select></label>
  <label class="field">Цаг <input type="time" id="time" value="18:00"></label>
  <div class="field">Хамт юу хийх вэ?<div class="chips" id="acts"></div></div>
  <button class="main" id="confirm">Энэ болно</button>
  <p class="small">Товчийг дарахад сонголт чинь надад очно</p>
  <p id="err" style="color:#d6336c"></p>
</main>

<main class="card hidden" id="done">
  <div class="bunny" id="bn3"></div>
  <h1>Тохирлоо!</h1>
  <div class="msg" id="summary"></div>
  <p class="small" id="st">Илгээж байна...</p>
  <div class="fb hidden" id="fb">
    <a class="main" id="share" href="#">Имэйлээр илгээх</a>
    <button class="link" id="copy">Эсвэл хуулж авах</button>
  </div>
</main>

<script>
var $=function(id){return document.getElementById(id)};
var TOPIC='bolzoo-35556d0a7c1d7f';
var N=["Үгүй", "Үнэхээр үү?", "Бодоод үзээч", "Гуйя, гуйя", "Би уйлчихна шүү", "Заавал уу?", "Нэг л бодоорой", "Чи намайг гомдоочихлоо", "Яагаад үгүй гэдэг юм бэ", "Тэгэлгүй яахав дээ", "Жаахан л бодоорой", "Би чамд бялуу авч өгнө", "Хөөрхөн минь", "Зүрх минь өвдчихлөө", "Хамгийн сайхан болзоо болно шүү", "Би сайн хүүхэд шүү", "Нэг л удаа", "Хонгор минь", "Уйлаад эхэллээ", "Нүд минь нойтон болчихлоо", "Чи хатуу хүн юм аа", "Би дахиад гуйя", "Тиймээ гэвэл сайхан шүү", "Муу болзоо биш шүү", "Чамд шоколад авна", "Би өөрөө бүгдийг зохион байгуулна", "Дахиад нэг бодоорой", "Хэн ч чамайг ингэж урьдаггүй", "Би хүлээгээд л байна", "Хонгор оо гуйя", "Тиймээ гэвэл би бүжиглэнэ", "Би үнэхээр гуйж байна", "Сэтгэл минь хагарлаа", "Гэхдээ чи ямар хөөрхөн юм бэ", "Гуйя гэж дээ", "Чи л надад хэрэгтэй", "Жижигхэн болзоо шүү", "Ганцхан удаа", "Юу ч болсон чи хөөрхөн", "Ядаж бодоод үзэхгүй юу", "Амлаж байна, гоё болно", "Би дахиад ч гуйна", "Чи мөн үү үгүй гэж байгаа нь", "Бараг л болчихсон", "Сүүлийн боломж шүү", "Хамгийн сүүлийн боломж", "Ялангуяа энэ удаа", "Одоо болтугай", "Сүүлийн сүүлийн"], Y=["Тиймээ", "Тиймээ, явъя", "Мэдээж тиймээ", "Тиймээ, болно", "Тиймээ, баяртай байна", "Тиймээ, явна аа", "Тиймээ, маш их", "Тиймээ, яг одоо", "Тиймээ, хамт явъя", "Тиймээ, зөвшөөрлөө"], TOTAL=100, TO='caixnaacj@gmail.com';
var TITLE='Надтай болзоонд явах уу?', SUB='Би чамайг маш их урьж байна';

function bunny(m){
  var st='fill="#fff" stroke="#ffb3d1" stroke-width="3"',line='fill="none" stroke="#3b1d3a" stroke-width="3.5" stroke-linecap="round"';
  var ears='<g class="ear l"><ellipse cx="48" cy="34" rx="13" ry="30" transform="rotate(-10 48 34)" '+st+'/><ellipse cx="48" cy="36" rx="6" ry="20" transform="rotate(-10 48 36)" fill="#ffc9dd"/></g><g class="ear r"><ellipse cx="92" cy="34" rx="13" ry="30" transform="rotate(10 92 34)" '+st+'/><ellipse cx="92" cy="36" rx="6" ry="20" transform="rotate(10 92 36)" fill="#ffc9dd"/></g>';
  var head='<ellipse cx="70" cy="92" rx="48" ry="42" '+st+'/><circle cx="36" cy="102" r="9" fill="#ff9ec4" opacity=".55"/><circle cx="104" cy="102" r="9" fill="#ff9ec4" opacity=".55"/><ellipse cx="70" cy="97" rx="4" ry="3" fill="#ff7aa8"/>';
  var eye=function(x){return '<ellipse cx="'+x+'" cy="88" rx="8" ry="10" fill="#3b1d3a"/><circle cx="'+(x-3)+'" cy="84" r="3.2" fill="#fff"/><circle cx="'+(x+3)+'" cy="92" r="1.6" fill="#fff"/>'};
  var tear=function(x,d){return '<path class="tear" style="animation-delay:'+d+'s" d="M'+x+' 96q-5 9 0 13q5-4 0-13z" fill="#7cc8ff"/>'};
  var f;
  if(m=='happy')f='<path d="M44 90q8-11 16 0M80 90q8-11 16 0" '+line+'/><path d="M60 106q10 10 20 0" '+line+'/>';
  else if(m=='love')f='<use href="#h" x="42" y="76" width="22" height="22" fill="#ff3d87"/><use href="#h" x="76" y="76" width="22" height="22" fill="#ff3d87"/><path d="M60 106q10 10 20 0" '+line+'/>';
  else if(m=='beg')f=eye(52)+eye(88)+'<path d="M64 106q3 4 6 0q3 4 6 0" '+line+'/>';
  else if(m=='sad')f=eye(52)+eye(88)+'<path d="M42 74l18 6M98 74l-18 6" '+line+'/><path d="M60 112q10-9 20 0" '+line+'/>'+tear(46,0);
  else f='<path d="M44 88q8 9 16 0M80 88q8 9 16 0" '+line+'/><path d="M60 106q10-10 20 0q-10 12-20 0z" fill="#c2306a"/>'+tear(48,0)+tear(92,.5)+tear(58,1);
  return '<svg viewBox="0 0 140 150" aria-hidden="true">'+ears+head+f+'</svg>';
}
function draw(id,m){$(id).innerHTML=bunny(m)}
function moodFor(n){return n===0?'happy':n<18?'beg':n<45?'sad':n<TOTAL?'cry':'beg'}
function ic(id){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','ic');s.innerHTML='<use href="#'+id+'"/>';return s}
function label(btn,t){btn.textContent=t+' ';btn.appendChild(ic('h'))}

var yes=$('yes'),no=$('no'),n=0;
$('title').textContent=TITLE;$('sub').textContent=SUB;
label(yes,Y[0]);draw('bn1','happy');draw('bn2','love');draw('bn3','love');

no.addEventListener('click',function(){
  n++;
  if(n>=TOTAL){no.classList.add('gone')}
  else{no.textContent=N[n%N.length];no.style.setProperty('--s',Math.max(.3,1-n*.007))}
  label(yes,Y[n%Y.length]);
  var g=Math.min(n,60);
  yes.style.fontSize=(20+g*.55)+'px';
  yes.style.padding=(14+g*.7)+'px '+(30+g*1.1)+'px';
  draw('bn1',moodFor(n));
  var b=$('bn1');b.classList.add('pop');setTimeout(function(){b.classList.remove('pop')},250);
  if(n<TOTAL)requestAnimationFrame(moveNo);
});
function moveNo(){
  var m=12,w=no.offsetWidth,h=no.offsetHeight,vw=window.innerWidth,vh=window.innerHeight;
  var y=yes.getBoundingClientRect(),x0=0,y0=0,t=0;
  do{x0=m+Math.random()*Math.max(0,vw-w-2*m);y0=m+Math.random()*Math.max(0,vh-h-2*m);t++}
  while(t<30&&x0<y.right+8&&x0+w>y.left-8&&y0<y.bottom+8&&y0+h>y.top-8);
  no.style.position='fixed';no.style.left=x0+'px';no.style.top=y0+'px';no.style.zIndex=5;
}

var d=new Date(),pad=function(x){return String(x).padStart(2,'0')};
(function(){
  var sel=$('date'),c=new Date(d.getFullYear(),d.getMonth(),d.getDate()),end=new Date(2026,9,11);
  while(c.getFullYear()<2026)c.setDate(c.getDate()+1);
  for(;c<=end;c.setDate(c.getDate()+1)){
    var w=c.getDay();if(w!==6&&w!==0)continue;
    var o=document.createElement('option');
    o.value=c.getFullYear()+'-'+pad(c.getMonth()+1)+'-'+pad(c.getDate());
    o.textContent=(c.getMonth()+1)+' сарын '+c.getDate()+', '+(w===0?'Ням':'Бямба');
    sel.appendChild(o);
  }
})();

yes.addEventListener('click',function(){
  $('ask').classList.add('hidden');$('pick').classList.remove('hidden');
  var cols=['#ff5c93','#ff9ec4','#ffb703','#a855f7','#ff3d87','#7cc8ff'];
  for(var i=0;i<44;i++){
    var s=document.createElementNS('http://www.w3.org/2000/svg','svg'),z=14+Math.random()*16;
    s.setAttribute('class','float');s.setAttribute('width',z);s.setAttribute('height',z);
    s.innerHTML='<use href="#'+(i%3?'h':'s')+'"/>';
    s.style.cssText='left:'+Math.random()*100+'vw;fill:'+cols[i%cols.length]+';animation-duration:'+(3+Math.random()*3)+'s;animation-delay:'+Math.random()*2+'s';
    document.body.appendChild(s);
  }
});

var ACTS=[["Хоолонд орох","хоолонд орно"],["Кофе","кофе уухаар явна"],["Алхах","зугаалж алхана"],["Боулинг","боулинг тоглоно"]];
var act=null,text='';
ACTS.forEach(function(a){
  var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=a[0];
  b.addEventListener('click',function(){
    act=a[1];
    document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});
    b.classList.add('on');$('err').textContent='';
  });
  $('acts').appendChild(b);
});

$('confirm').addEventListener('click',function(){
  var dv=$('date').value,tv=$('time').value;
  if(!dv||!tv){$('err').textContent='Өдөр, цагаа сонгоорой';return}
  if(!act){$('err').textContent='Юу хийхээ сонгоорой';return}
  var p=dv.split('-'),ds=p[0]+' оны '+Number(p[1])+' сарын '+Number(p[2])+'-нд',dn=new Date(p[0],p[1]-1,p[2]).getDay()===0?'Ням':'Бямба';
  text='Би '+ds+', '+tv+' цагт болзоонд явна. Хамт '+act+'.';
  $('summary').textContent=text;
  var body='Болзооны урилгад хариу ирлээ!\n\nОгноо: '+ds+' ('+dn+')\nЦаг: '+tv+'\nХамт хийх зүйл: '+act+'\n"Үгүй" товчийг дарсан тоо: '+n+(n>=TOTAL?' (товч бүрмөсөн алга болтол дарсан)':'')+'\n\n'+text;
  $('share').href='mailto:'+TO+'?subject='+encodeURIComponent('Болзооны урилга: хариу ирлээ')+'&body='+encodeURIComponent(body);
  $('pick').classList.add('hidden');$('done').classList.remove('hidden');
  fetch('https://ntfy.sh/',{method:'POST',body:JSON.stringify({topic:TOPIC,title:'Болзооны урилга: хариу ирлээ',message:body,tags:['heart'],priority:4})})
    .then(function(r){if(!r.ok)throw 0;$('st').textContent='Сонголт чинь надад очлоо. Баярлалаа!'})
    .catch(function(){$('st').textContent='Автоматаар очсонгүй. Доорх товчоор надад илгээгээрэй.';$('fb').classList.remove('hidden')});
});
$('copy').addEventListener('click',function(){
  var b=$('copy');
  try{navigator.clipboard.writeText(text+' ("Үгүй" товчийг '+n+' удаа дарсан)').then(function(){b.textContent='Хууллаа'},function(){b.textContent='Дээрх бичвэрийг хуулаарай'})}
  catch(e){b.textContent='Дээрх бичвэрийг хуулаарай'}
});
</script>
</body>
</html>
